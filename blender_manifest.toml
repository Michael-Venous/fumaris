schema_version = "1.0.0"

id = "fumaris"
version = "0.2.0"
name = "Fumaris"
tagline = "Interactive GPU smoke and fire simulation"
maintainer = "Fumaris"
type = "add-on"

blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["linux-x64", "windows-x64"]

[permissions]
files = "Write caches and run the bundled Fumaris simulation bridge"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.pyc",
  "*.zip",
]
